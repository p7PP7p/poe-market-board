name: daily-market-board

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write
  pages: write

concurrency:
  group: market-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch data and build page
        env:
          POE_LEAGUE: Covens
          OUT_DIR: .
        run: python fetch.py

      - name: Commit updated page
        run: |
          git config user.name  "market-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 可選：每天把連結推到微信（在 repo Secrets 設定 SERVERCHAN_KEY 後自動生效）
      - name: Push link (optional)
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          if [ -z "$KEY" ]; then
            echo "SERVERCHAN_KEY 未設定，跳過推送"
            exit 0
          fi
          TITLE="PoE 行情交易榜已更新"
          DESP="今日榜單已刷新：${PAGES_URL:-见仓库 Pages 地址}"
          curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            -d "title=${TITLE}" -d "desp=${DESP}" || true
